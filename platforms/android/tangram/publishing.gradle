apply plugin: 'maven-publish'
apply plugin: 'signing'

// Components from the Android Gradle plugin are only created during the afterEvaluate phase, so
// configure publications using the afterEvaluate() lifecycle method.
// https://developer.android.com/studio/build/maven-publish-plugin
afterEvaluate { project ->

  publishing {
    publications {
      maven(MavenPublication) {
        groupId = project.group
        artifactId = 'tangram'
        version = project.version
        pom {
          name = 'Tangram ES'
          description = 'Tangram Android SDK'
          url = 'https://github.com/tintabee/tangram-es'
          licenses {
            license {
              name = 'The MIT License (MIT)'
              url = 'https://opensource.org/licenses/MIT'
              distribution = 'repo'
            }
          }
          developers {
            developer {
              name = 'Mapzen'
            }
          }
          scm {
            connection = 'scm:git:https://github.com/tintabee/tangram-es.git'
            developerConnection = 'scm:git:ssh://git@github.com/tintabee/tangram-es.git'
            url = 'https://github.com/tintabee/tangram-es'
          }
        }

        from components.release
      }
    }
    repositories {
      maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/tintabee/tangram-es")
        credentials {
          username = project.findProperty('gpr.user') ?: System.env.GITHUB_ACTOR
          password = project.findProperty('gpr.key') ?: System.env.GITHUB_TOKEN
        }
      }
    }
  }

  signing {
    required { false }
    sign publishing.publications.maven
  }
}
